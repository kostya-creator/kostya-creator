name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPOS=$(gh api users/kostya-creator --jq '.public_repos')
          FOLLOWERS=$(gh api users/kostya-creator --jq '.followers')

          cat > stats.svg <<EOF
          <svg width="500" height="180" xmlns="http://www.w3.org/2000/svg">
            <rect width="500" height="180" rx="16" fill="#000000"/>

            <text x="30" y="45"
              fill="#ffffff"
              font-family="Arial, sans-serif"
              font-size="24"
              font-weight="bold">
              Kostya's GitHub
            </text>

            <text x="30" y="85"
              fill="#999999"
              font-family="Arial, sans-serif"
              font-size="16">
              Repositories
            </text>

            <text x="30" y="110"
              fill="#ff4e00"
              font-family="Arial, sans-serif"
              font-size="22"
              font-weight="bold">
              $REPOS
            </text>

            <text x="250" y="85"
              fill="#999999"
              font-family="Arial, sans-serif"
              font-size="16">
              Followers
            </text>

            <text x="250" y="110"
              fill="#ff4e00"
              font-family="Arial, sans-serif"
              font-size="22"
              font-weight="bold">
              $FOLLOWERS
            </text>

            <text x="30" y="150"
              fill="#555555"
              font-family="Arial, sans-serif"
              font-size="13">
              Updated automatically
            </text>
          </svg>
          EOF

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats.svg

          git diff --cached --quiet || git commit -m "Update GitHub stats"
          git push
