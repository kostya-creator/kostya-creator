name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Collect GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse

          USERNAME = "kostya-creator"
          TOKEN = os.environ["GH_TOKEN"]

          def gh_api(endpoint):
              url = f"https://api.github.com{endpoint}"

              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )

              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          # --------------------------------------------------
          # Get repositories
          # --------------------------------------------------

          repos = []
          page = 1

          while True:
              data = gh_api(
                  f"/users/{USERNAME}/repos"
                  f"?type=public&per_page=100&page={page}"
              )

              if not data:
                  break

              repos.extend(data)
              page += 1

          # Ignore forked repositories
          repos = [
              repo for repo in repos
              if not repo.get("fork", False)
          ]

          repo_count = len(repos)

          # Total stars on own non-fork repositories
          stars = sum(
              repo.get("stargazers_count", 0)
              for repo in repos
          )

          # --------------------------------------------------
          # Count ONLY Kostya's commits
          # --------------------------------------------------

          commits = 0

          for repo in repos:
              name = repo["name"]

              page = 1

              while True:
                  params = urllib.parse.urlencode({
                      "author": USERNAME,
                      "per_page": 100,
                      "page": page,
                  })

                  try:
                      data = gh_api(
                          f"/repos/{USERNAME}/{name}/commits?{params}"
                      )
                  except Exception:
                      break

                  if not data:
                      break

                  commits += len(data)

                  if len(data) < 100:
                      break

                  page += 1

          # --------------------------------------------------
          # Find real contributors
          # --------------------------------------------------

          contributors = set()

          for repo in repos:
              name = repo["name"]
              page = 1

              while True:
                  try:
                      data = gh_api(
                          f"/repos/{USERNAME}/{name}/contributors"
                          f"?per_page=100&page={page}"
                      )
                  except Exception:
                      break

                  if not data:
                      break

                  for contributor in data:
                      login = contributor.get("login")
                      contributor_type = contributor.get("type")

                      # Ignore:
                      # - Kostya himself
                      # - GitHub bots
                      # - accounts without a login
                      if (
                          login
                          and login.lower() != USERNAME.lower()
                          and contributor_type == "User"
                      ):
                          contributors.add(login.lower())

                  if len(data) < 100:
                      break

                  page += 1

          contributor_count = len(contributors)

          # --------------------------------------------------
          # Generate SVG
          # --------------------------------------------------

          svg = f'''<svg
            width="700"
            height="300"
            viewBox="0 0 700 300"
            xmlns="http://www.w3.org/2000/svg"
          >

            <rect
              width="700"
              height="300"
              rx="20"
              fill="#000000"
            />

            <text
              x="35"
              y="55"
              fill="#ffffff"
              font-family="Arial, Helvetica, sans-serif"
              font-size="25"
              font-weight="700"
            >
              FOR CONSTANTINOPLE 🔥⚔️🛡️
            </text>

            <text
              x="35"
              y="90"
              fill="#666666"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14"
            >
              github.com/{USERNAME}
            </text>

            <!-- Repositories -->

            <text
              x="45"
              y="145"
              fill="#777777"
              font-family="Arial, Helvetica, sans-serif"
              font-size="15"
            >
              REPOSITORIES
            </text>

            <text
              x="45"
              y="180"
              fill="#ff4e00"
              font-family="Arial, Helvetica, sans-serif"
              font-size="28"
              font-weight="700"
            >
              {repo_count}
            </text>

            <!-- Stars -->

            <text
              x="250"
              y="145"
              fill="#777777"
              font-family="Arial, Helvetica, sans-serif"
              font-size="15"
            >
              STARS
            </text>

            <text
              x="250"
              y="180"
              fill="#ff4e00"
              font-family="Arial, Helvetica, sans-serif"
              font-size="28"
              font-weight="700"
            >
              {stars}
            </text>

            <!-- Commits -->

            <text
              x="450"
              y="145"
              fill="#777777"
              font-family="Arial, Helvetica, sans-serif"
              font-size="15"
            >
              YOUR COMMITS
            </text>

            <text
              x="450"
              y="180"
              fill="#ff4e00"
              font-family="Arial, Helvetica, sans-serif"
              font-size="28"
              font-weight="700"
            >
              {commits}
            </text>

            <!-- Contributors -->

            <text
              x="45"
              y="235"
              fill="#777777"
              font-family="Arial, Helvetica, sans-serif"
              font-size="15"
            >
              CONTRIBUTORS
            </text>

            <text
              x="45"
              y="270"
              fill="#ff4e00"
              font-family="Arial, Helvetica, sans-serif"
              font-size="28"
              font-weight="700"
            >
              {contributor_count}
            </text>

            <text
              x="450"
              y="270"
              fill="#444444"
              font-family="Arial, Helvetica, sans-serif"
              font-size="12"
            >
              UPDATED DAILY
            </text>

          </svg>'''

          with open("stats.svg", "w", encoding="utf-8") as file:
              file.write(svg)

          print(f"Repositories: {repo_count}")
          print(f"Stars: {stars}")
          print(f"Your commits: {commits}")
          print(f"Contributors: {contributor_count}")
          PY

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update GitHub stats"
          git push origin HEAD:main
